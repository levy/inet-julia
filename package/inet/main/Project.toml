# The umbrella over the component packages. It re-exports their modules, so
# `using Inet` still reaches everything, and it owns the one thing no single
# component can: inet_simulation_catalog, which has to know every model there
# is.

[deps]
InetCommon = "3e5f522d-74dd-49cc-880c-be4fb7395c4f"
InetLinkLayer = "6936b046-6a37-41be-850a-5641ac0f1d4b"
InetPacket = "6d8371f4-7b79-446a-94d5-7f2c239cd98b"
InetQueuing = "d26f14db-95a6-410b-bce8-25d11d35faf9"
OmnetppSimulator = "c7c75596-d0aa-4729-9b4f-00bf016ec83d"

[sources]
InetCommon = {path = "../../common/main"}
InetLinkLayer = {path = "../../linklayer/main"}
InetPacket = {path = "../../packet/main"}
InetQueuing = {path = "../../queuing/main"}
OmnetppSimulator = {path = "../../../../omnetpp-julia/package/simulator/main"}

[compat]
julia = "1.11"
