name = "Inet"
uuid = "e0528acb-81c4-485d-8c9f-a32e8325f910"
version = "0.1.0"
authors = []
entryfile = "Inet.jl"

# The umbrella over the component packages. It re-exports their modules, so
# `using Inet` still reaches everything, and it owns the two things no single
# component can: inet_simulation_catalog, which has to know every model there
# is, and the packet diagram, which needs both a packet and the editor stack.
#
# ProjecturedVisual is the one editor package named here. It re-exports the
# kernel and base modules the diagram uses as its own (`ProjecturedVisual.
# CellModule` and the rest), so the narrower dependency reaches everything
# without pulling in the domains and the backends the umbrella would.

[deps]
InetCommon = "3e5f522d-74dd-49cc-880c-be4fb7395c4f"
InetLinkLayer = "6936b046-6a37-41be-850a-5641ac0f1d4b"
InetPacket = "6d8371f4-7b79-446a-94d5-7f2c239cd98b"
InetQueuing = "d26f14db-95a6-410b-bce8-25d11d35faf9"
OmnetppSimulator = "c7c75596-d0aa-4729-9b4f-00bf016ec83d"
ProjecturedVisual = "c94a1234-2b3c-4d5e-8f6a-7b8c9d0e1f23"

[sources]
InetCommon = {path = "../../common/main"}
InetLinkLayer = {path = "../../linklayer/main"}
InetPacket = {path = "../../packet/main"}
InetQueuing = {path = "../../queuing/main"}
OmnetppSimulator = {path = "../../../../omnetpp-julia/package/simulator/main"}
ProjecturedVisual = {path = "../../../../projectured-julia/package/visual/main"}

[compat]
julia = "1.11"
