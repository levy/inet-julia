# The command-line runner — one simulation, from a command line, to a pair of
# result files. It is the package the `inet-julia` executable is built from.
#
# Its dependency list is a contract, not a convenience. A runner draws nothing,
# opens no window and reads no gesture, so the editor must not be reachable
# from here: no ProjecturedVisual, no ProjecturedDomain, no Projectured
# umbrella, no OmnetppLegacy, no DataFrames, no Revise. `test_runner_closure()`
# in the test package asserts it, and plan/done/native-simulation-binary.md
# §2 says why.
#
# ProjecturedKernel and ProjecturedBase arrive under OmnetppSimulator and stay:
# they are the substrate the simulator declares its own model, engine and
# execution types with, not the editor.

