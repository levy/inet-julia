# Test package for InetQueuing — one phase per wave of
# plan/pending/queuing-model-migration.md, each driving elements inside a real
# SequentialSimulator. It also covers InetCommon's lookup (phase0), whose tests
# are written against the packet protocol and so belong on this side of the
# dependency edge.
#
# `tutorial.jl` is why the example package and the presentation stack are here:
# a test package depends on the example package below it, and the tutorial's
# assertions are about pages that only the example package holds.

