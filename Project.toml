# Development ENVIRONMENT for the whole repository — deliberately not a package.
# `julia --project=.` resolves every component plus the simulator and the
# ProjecturEd kernel, so a cross-component change is one REPL. Each package also
# carries its own [sources] so its environment can be activated standalone; when
# working from here, these win.
